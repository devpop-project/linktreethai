<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients matching the glowing neon Thai flame & circuit tree -->
    <linearGradient id="flameGrad" x1="20%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="60%" stop-color="#C084FC" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="innerFlameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#60A5FA" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <linearGradient id="goldLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="purpleBranchGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="60%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>

    <linearGradient id="cyanBranchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="goldBranchGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Glow Filter for High-Def Crisp Rendering -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neonGlow)">
    <!-- LEFT SIDE: OUTER FLAME / THAI KANOK WINGS -->
    <!-- Far Left Wing -->
    <path 
      d="M 160 410 C 105 380 70 310 76 250 C 80 200 115 160 145 155 C 135 180 135 210 152 230 C 130 270 120 330 170 380 Z" 
      fill="none" 
      stroke="url(#flameGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Main High Flame Tongue -->
    <path 
      d="M 215 410 C 170 380 110 320 125 240 C 135 180 180 140 190 90 C 205 125 190 160 215 195 C 235 225 235 280 210 330" 
      fill="none" 
      stroke="url(#flameGrad)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Inner Blue Flame Swirl -->
    <path 
      d="M 185 365 C 150 340 130 290 145 240 C 160 190 205 165 210 125 C 230 170 205 215 225 250 C 240 275 220 330 170 360" 
      fill="none" 
      stroke="url(#innerFlameGrad)" 
      stroke-width="10" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Inner Crest Hook -->
    <path 
      d="M 165 295 C 175 260 210 260 220 230 C 228 265 195 285 180 325" 
      fill="none" 
      stroke="url(#innerFlameGrad)" 
      stroke-width="8" 
      stroke-linecap="round"
    />

    <!-- CENTER / BOTTOM: SPIRAL GOLD & PURPLE LOOP (KNOT) -->
    <path 
      d="M 205 405 C 220 425 250 435 280 425 C 320 410 350 370 350 320 C 350 260 290 240 250 280 C 220 310 220 365 255 385 C 285 400 325 385 345 350 C 360 320 360 260 340 220" 
      fill="none" 
      stroke="url(#goldLoopGrad)" 
      stroke-width="13" 
      stroke-linecap="round"
    />

    <path 
      d="M 255 385 C 235 375 230 340 245 320 C 265 295 305 310 305 340 C 305 370 275 390 240 380" 
      fill="none" 
      stroke="url(#flameGrad)" 
      stroke-width="10" 
      stroke-linecap="round"
    />

    <!-- RIGHT SIDE: DIGITAL CIRCUIT & NEURAL BRANCHES -->
    <!-- Branch 1 (Leftmost circuit stem curving to node) -->
    <path 
      d="M 275 265 C 290 210 300 180 310 145" 
      fill="none" 
      stroke="url(#purpleBranchGrad)" 
      stroke-width="11" 
      stroke-linecap="round"
    />
    <circle cx="310" cy="145" r="9" fill="#0B0F17" stroke="#C084FC" stroke-width="7" />

    <!-- Branch 2 (Tall Center Branch to cyan top node) -->
    <path 
      d="M 330 280 C 345 220 350 160 355 105" 
      fill="none" 
      stroke="url(#cyanBranchGrad)" 
      stroke-width="11" 
      stroke-linecap="round"
    />
    <circle cx="355" cy="105" r="9" fill="#0B0F17" stroke="#38BDF8" stroke-width="7" />

    <!-- Branch 3 (Upper right Gold branch) -->
    <path 
      d="M 350 200 C 365 170 385 145 400 135" 
      fill="none" 
      stroke="url(#goldBranchGrad)" 
      stroke-width="10" 
      stroke-linecap="round"
    />
    <circle cx="400" cy="135" r="9" fill="#0B0F17" stroke="#FBBF24" stroke-width="7" />

    <!-- Branch 4 (Mid right Cyan branch) -->
    <path 
      d="M 345 240 C 375 220 405 210 425 205" 
      fill="none" 
      stroke="url(#cyanBranchGrad)" 
      stroke-width="10" 
      stroke-linecap="round"
    />
    <circle cx="425" cy="205" r="9" fill="#0B0F17" stroke="#38BDF8" stroke-width="7" />

    <!-- Branch 5 (Lower right Gold hook) -->
    <path 
      d="M 335 340 C 365 310 395 285 415 255" 
      fill="none" 
      stroke="url(#goldBranchGrad)" 
      stroke-width="10" 
      stroke-linecap="round"
    />
    <circle cx="415" cy="255" r="9" fill="#0B0F17" stroke="#FBBF24" stroke-width="7" />

    <!-- Branch 6 (Side arc spike) -->
    <path 
      d="M 270 170 C 295 195 320 230 330 260" 
      fill="none" 
      stroke="url(#purpleBranchGrad)" 
      stroke-width="9" 
      stroke-linecap="round"
    />

    <!-- Cyan Node near lower middle -->
    <path 
      d="M 300 270 C 290 250 280 240 280 230" 
      fill="none" 
      stroke="url(#cyanBranchGrad)" 
      stroke-width="8" 
      stroke-linecap="round"
    />
    <circle cx="280" cy="230" r="7" fill="#0B0F17" stroke="#38BDF8" stroke-width="6" />
  </g>
</svg>
