<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06C755"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" stroke="#10B981" stroke-width="3.5" />
  
  <!-- Branch Connections -->
  <line x1="50" y1="32" x2="26" y2="68" stroke="url(#branchGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="32" x2="74" y2="68" stroke="url(#branchGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="26" y1="68" x2="74" y2="68" stroke="#10B981" stroke-width="3.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Top Root Node (Emerald) -->
  <circle cx="50" cy="30" r="13" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="50" cy="30" r="5" fill="#0F172A" />

  <!-- Bottom Left Node (Teal Link) -->
  <circle cx="26" cy="68" r="10" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="26" cy="68" r="4" fill="#0F172A" />

  <!-- Bottom Right Node (Amber Shop) -->
  <circle cx="74" cy="68" r="10" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="74" cy="68" r="4" fill="#0F172A" />
</svg>